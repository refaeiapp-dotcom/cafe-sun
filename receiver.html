<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تنبيه</title>
</head>
<body style="text-align:center; margin-top:50px;">

<h2>🔔 تنبيه</h2>

<button onclick="playSound()">تشغيل انذار</button>

<audio id="sound" src="alert.mp3" preload="auto"></audio>

<script>
function playSound() {
  const sound = document.getElementById("sound");
  sound.currentTime = 0;
  sound.play();
}
</script>

</body>
</html>
