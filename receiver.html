<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>استقبال</title>
</head>
<body>

<h2>🔔 في انتظار تنبيه</h2>
<audio id="bell" src="alert.mp3"></audio>

<script>
const bell = document.getElementById("bell");

// طلب موافقة مرة واحدة
document.body.onclick = () => {
  localStorage.setItem("audioAllowed","yes");
};

setInterval(() => {
  if (localStorage.getItem("playSound") === "yes") {
    localStorage.removeItem("playSound");
    bell.currentTime = 0;
    bell.play();
  }
}, 500);
</script>

</body>
</html>
