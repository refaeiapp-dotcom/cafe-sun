<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تنبيه</title>
</head>
<body style="text-align:center; margin-top:50px;">

<h2 id="msg">🔔 في انتظار التنبيه</h2>

<audio id="bell" src="alert.mp3" preload="auto"></audio>

<script>
const bell = document.getElementById("bell");

// لو المستخدم وافق قبل كده
if (localStorage.getItem("audioAllowed") === "yes") {
  playSound();
} else {
  // أول مرة فقط
  document.body.onclick = () => {
    localStorage.setItem("audioAllowed", "yes");
    playSound();
    document.body.onclick = null;
  };
}

function playSound() {
  bell.currentTime = 0;
  bell.play();
  document.getElementById("msg").innerText = "🔔 تنبيه صوتي";
}
</script>

</body>
</html>
